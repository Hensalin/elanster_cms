<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Example website blog</title></head>
<body>
<!-- Example of how a website (Elanster, We Are Zion, Indzara...) shows CMS articles.
     Replace CMS_URL, SITE and KEY with your own. Use a READ-ONLY website key, never an admin login. -->
<h1>Blog</h1>
<div id="list">Loading…</div>
<script>
const CMS_URL = "http://localhost:3100", SITE = "elanster", KEY = window.CMS_KEY;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
fetch(`${CMS_URL}/api/v1/websites/${SITE}/blogs?limit=10`, { headers: { "X-API-Key": KEY } })
  .then((r) => r.ok ? r.json() : Promise.reject(r.status))
  .then(({ items }) => {
    document.getElementById("list").innerHTML = items.length
      ? items.map((b) => `<article><h2 class="t">${esc(b.title)}</h2><p>${esc(b.excerpt)}</p></article>`).join("")
      : "<p>No articles yet.</p>";
  })
  .catch((e) => (document.getElementById("list").textContent = "Could not load articles (" + e + ")"));
</script>
</body></html>
